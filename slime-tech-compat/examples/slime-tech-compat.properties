# Slime Tech Compat 0.3.0. Copy to config/slime-tech-compat.properties.
# Restart after editing. All integrity protections remain enabled.
# true blocks lava and mod-fluid world sources. It does not consume/remove sources.
blockNonWaterWorldSources=false
# true sets new/missing-charge grinders to 0 FE and requires 120 FE before processing.
# Explicit saved energy and the 120 FE completion cost are preserved.
fixGrinderEnergy=false
# Allowed range: 1..4096. Mixed, oversized, or unloaded-edge networks fail closed.
maxTankNetworkMembers=512
