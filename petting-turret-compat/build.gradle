plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = 'dev.marmite.pettingturretcompat'
version = mod_version

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = neo_version
    addModdingDependenciesTo sourceSets.test
    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        petting_turret_compat_tests {
            sourceSet(sourceSets.test)
        }
    }
    runs {
        configureEach {
            loadedMods = [mods."${mod_id}"]
        }
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        compatTestServer {
            server()
            gameDirectory = project.file('run-compat-tests')
            programArgument '--nogui'
            sourceSet = sourceSets.test
            loadedMods = [mods."${mod_id}", mods.petting_turret_compat_tests]
        }
    }
}

def compatTestDirectory = layout.projectDirectory.dir('run-compat-tests')
def compatTestResult = compatTestDirectory.file('compat-test-result.txt')

// NeoForge 26.1.2.71's Eula constructor accepts development runs through
// SharedConstants.IS_RUNNING_IN_IDE, including the first run in a fresh directory.
tasks.register('prepareCompatTestEnvironment') {
    doLast {
        def directory = compatTestDirectory.asFile
        directory.mkdirs()
        delete compatTestResult.asFile
        new File(directory, 'server.properties').text = '''server-ip=127.0.0.1
server-port=0
online-mode=false
enable-query=false
enable-rcon=false
view-distance=2
simulation-distance=2
spawn-protection=0
max-players=1
level-name=compat-test-world
'''
    }
}

tasks.named('runCompatTestServer').configure {
    dependsOn tasks.named('prepareCompatTestEnvironment')
    doLast {
        def result = compatTestResult.asFile
        if (!result.isFile() || !(result.text.trim() ==~ /PASS assertions=[1-9][0-9]*/)) {
            throw new GradleException('Compatibility tests did not complete successfully. Check run-compat-tests/logs/latest.log.')
        }
    }
}

// Local development dependencies are referenced, never bundled in this mod's jar.
dependencies {
    implementation files(
        '../mods/ltxi-26.1.2-1.1.3.jar',
        '../mods/limacore-26.1.2-2.4.0.jar',
        '../mods/petting-4.2.3-beta.3-neoforge-26.1.2.jar',
        '../mods/GrimoireOfGaia4-26.1.2-7.0.0-alpha.2.jar'
    )
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// src/test is a NeoForge runtime test mod, executed by runCompatTestServer.
// It contains no JUnit tests for Gradle's standard test task to discover.
tasks.named('test', Test).configure {
    failOnNoDiscoveredTests = false
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
    distributionSha256Sum = '9c0f7faeeb306cb14e4279a3e084ca6b596894089a0638e68a07c945a32c9e14'
}
